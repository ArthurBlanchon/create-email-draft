name: CI

# Lints, tests and builds every pull request (yours and Dependabot's) before
# it reaches dev or main. deploy.yml only runs after a push, and only builds:
# without this workflow a pull request shows no checks at all.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Same as deploy.yml: pnpm caching and a frozen install both need a
          # committed pnpm-lock.yaml, which a fresh scaffold doesn't have.
          package-manager-cache: false
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
